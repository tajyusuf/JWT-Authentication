[project]
name = "fastapi-auth-service"
version = "0.1.0"
description = "Production-grade authentication and authorization microservice with FastAPI"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "greenlet>=3.0.3",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.9.0",
  "pwdlib[argon2]>=0.2.1",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
